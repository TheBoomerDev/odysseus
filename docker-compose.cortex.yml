services:
  cortex:
    build:
      context: .
      dockerfile: Dockerfile.cortex
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:z
    environment:
      - LLM_HOST=${LLM_HOST:-localhost}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/cortex.db}
    restart: unless-stopped
