name: CORTEX CI

on:
  push:
    branches: [dev, main]
    paths:
      - "cortex/**"
      - "routes/cortex_routes.py"
      - "tests/cortex/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "cortex/**"
      - "routes/cortex_routes.py"
      - "tests/cortex/**"

jobs:
  cortex-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install ruff pytest pytest-asyncio pytest-cov

      - name: Lint with Ruff
        run: ruff check cortex/ routes/cortex_routes.py

      - name: Type check with Pyright (basic)
        run: |
          pip install pyright
          pyright cortex/ || echo "pyright warnings (non-blocking)"

      - name: Test with pytest-cov
        run: |
          python -m pytest tests/cortex/ -v --cov=cortex --cov-fail-under=90

      - name: Summary
        run: |
          echo "✅ CORTEX CI passed"
          echo "Modules: $(find cortex/ -name '*.py' | wc -l)"
          echo "Tests: $(python -m pytest tests/cortex/ --collect-only -q 2>&1 | tail -1)"
